<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝満山 智昇院 行事参加申込</title><style>body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f5f5f0;color:#242c25;margin:0}main{max-width:540px;margin:20px auto;padding:20px;background:white;border-radius:16px;box-shadow:0 3px 18px #0001}h1{text-align:center;font-size:1.45rem;margin:5px}h2{text-align:center;font-size:1.1rem;margin:6px 0 22px}label{display:block;font-weight:bold;margin:18px 0 7px}input{box-sizing:border-box;width:100%;font-size:18px;padding:12px;border:1px solid #aeb8ae;border-radius:9px}input[readonly]{background:#f0f4ed}button{font-size:18px;padding:14px;border:0;border-radius:10px;background:#237c4a;color:white;width:100%;margin-top:12px;font-weight:bold}button.secondary{background:#e5f1e8;color:#16482d}p{line-height:1.6}small{color:#555}#preview{white-space:pre-wrap;background:#f5f7f3;border-radius:10px;padding:14px;line-height:1.8}#status{font-weight:bold;color:#16693b}footer{text-align:center;margin-top:22px;color:#555;font-size:12px}</style></head><body><main><h1>宝満山 智昇院</h1><h2>行事参加申込</h2><p>ご参加予定の方は、代表者名と人数をご入力ください。お申し込みは任意です。</p><label for="date">⓪ 日付</label><input id="date" readonly value="20261128"><label for="event">① 行事</label><input id="event" readonly value="不動加持"><label for="time">② 時間</label><input id="time" readonly value="10:30"><label for="person">③ 会社名 または 代表者名</label><input id="person" maxlength="80" autocomplete="name" placeholder="お名前を入力（音声入力も可）"><label for="adult">④ 中学生以上の人数</label><input id="adult" type="number" min="0" max="999" step="1" inputmode="numeric" value="1"><label for="child">⑤ 小学生以下の人数</label><input id="child" type="number" min="0" max="999" step="1" inputmode="numeric" value="0"><label for="total">⑥ 総人数（自動計算）</label><input id="total" readonly value="1"><h2>送信内容の確認</h2><div id="preview"></div><button id="share">LINEへ送る（共有先を選択）</button><button id="copy" class="secondary">送信内容をコピー</button><p id="status" role="status"></p><small>LINEへの送信は、共有先を選び、LINE側で送信を確定して完了します。LINEが共有候補に出ない場合は「送信内容をコピー」してLINEに貼り付けてください。</small><footer>智昇院 行事参加申込・試作版</footer></main><script>
const $=id=>document.getElementById(id);const ids=['date','event','time','person','adult','child'];function validCount(id){const s=$(id).value;const n=Number(s);return s.trim()!==''&&Number.isInteger(n)&&n>=0&&n<=999?n:null}function payload(){const a=validCount('adult'),c=validCount('child');$('total').value=a===null||c===null?'':a+c;return `⓪${$('date').value}\n①${$('event').value}\n②${$('time').value}\n③${$('person').value.trim()}\n④${a??''}\n⑤${c??''}\n⑥${a===null||c===null?'':a+c}`}function check(){const a=validCount('adult'),c=validCount('child');if(!$('person').value.trim()){alert('会社名または代表者名を入力してください。');$('person').focus();return false}if(a===null||c===null||a+c===0){alert('参加人数を正しく入力してください。');return false}return true}function refresh(){$('preview').textContent=payload();$('status').textContent=''}ids.forEach(id=>$(id).addEventListener('input',refresh));refresh();$('copy').onclick=async()=>{if(!check())return;try{await navigator.clipboard.writeText(payload());$('status').textContent='コピーしました。LINEに貼り付けて送信してください。'}catch(e){$('status').textContent='コピーできませんでした。HTTPS公開後に再度お試しください。'}};$('share').onclick=async()=>{if(!check())return;const text=payload();if(navigator.share){try{await navigator.share({text});$('status').textContent='共有先で送信を確定してください。'}catch(e){if(e.name!=='AbortError')$('status').textContent='共有できませんでした。コピーをお試しください。'}}else{try{await navigator.clipboard.writeText(text);$('status').textContent='共有機能がないためコピーしました。LINEへ貼り付けてください。'}catch(e){$('status').textContent='この環境では共有できません。'}}};
</script></body></html>
